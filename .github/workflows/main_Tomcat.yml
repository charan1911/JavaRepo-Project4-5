name: Build and Deploy Java WAR to Tomcat

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # --------------------------------------------------
      # 3. Build WAR using Maven
      # --------------------------------------------------
      - name: Build WAR
        run: |
          mvn clean package -DskipTests

          echo "===== BUILD DIRECTORY ====="
          ls -lah target/

          echo "===== WAR FILE ====="
          ls -lh target/*.war

      # --------------------------------------------------
      # 4. Upload WAR as artifact
      # --------------------------------------------------
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: neontask-war
          path: target/*.war


  deploy-tomcat:
    name: Deploy WAR to Tomcat
    needs: build
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 5. Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 6. Download WAR artifact
      # --------------------------------------------------
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: neontask-war
          path: target

      # --------------------------------------------------
      # 7. Verify WAR
      # --------------------------------------------------
      - name: Verify WAR
        run: |
          echo "===== DOWNLOADED WAR ====="
          ls -lah target/

          test -f target/neontask.war

      # --------------------------------------------------
      # 8. Configure SSH
      # --------------------------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # --------------------------------------------------
      # 9. Prepare EC2
      # --------------------------------------------------
      - name: Prepare EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -e

          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"

          java -version


          echo "======================================"
          echo "CHECK TOMCAT"
          echo "======================================"

          if [ -f /opt/tomcat/bin/catalina.sh ]; then

              echo "Tomcat already exists."
              echo "Using existing Tomcat installation."

          else

              echo "Tomcat not found."
              echo "Installing Tomcat..."

              sudo mkdir -p /opt

              sudo useradd \
                --system \
                --home-dir /opt/tomcat \
                --shell /sbin/nologin \
                tomcat 2>/dev/null || true

              cd /tmp

              sudo rm -rf apache-tomcat-10.1.60

              curl -fL \
                -o apache-tomcat.tar.gz \
                https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.60/bin/apache-tomcat-10.1.60.tar.gz

              sudo tar -xzf apache-tomcat.tar.gz -C /opt

              sudo rm -rf /opt/tomcat

              sudo mv /opt/apache-tomcat-10.1.60 /opt/tomcat

          fi


          echo "======================================"
          echo "CHECK TOMCAT USER"
          echo "======================================"

          if id tomcat >/dev/null 2>&1; then

              echo "tomcat user exists."

          else

              echo "Creating tomcat user."

              sudo useradd \
                --system \
                --home-dir /opt/tomcat \
                --shell /sbin/nologin \
                tomcat

          fi


          echo "======================================"
          echo "VERIFY TOMCAT FILES"
          echo "======================================"

          sudo test -f /opt/tomcat/bin/catalina.sh
          sudo test -f /opt/tomcat/bin/startup.sh
          sudo test -f /opt/tomcat/bin/shutdown.sh

          echo "Tomcat scripts found."


          echo "======================================"
          echo "FIX TOMCAT PERMISSIONS"
          echo "======================================"

          sudo chown -R tomcat:tomcat /opt/tomcat

          sudo chmod +x /opt/tomcat/bin/*.sh

          sudo mkdir -p /opt/tomcat/temp
          sudo mkdir -p /opt/tomcat/logs
          sudo mkdir -p /opt/tomcat/work
          sudo mkdir -p /opt/tomcat/webapps

          sudo chown -R tomcat:tomcat /opt/tomcat/temp
          sudo chown -R tomcat:tomcat /opt/tomcat/logs
          sudo chown -R tomcat:tomcat /opt/tomcat/work
          sudo chown -R tomcat:tomcat /opt/tomcat/webapps


          echo "======================================"
          echo "TOMCAT VERSION"
          echo "======================================"

          sudo -u tomcat /opt/tomcat/bin/catalina.sh version


          echo "======================================"
          echo "CREATE TOMCAT SERVICE"
          echo "======================================"

          sudo tee /etc/systemd/system/tomcat.service > /dev/null << 'SERVICE'

          [Unit]
          Description=Apache Tomcat 10
          After=network.target

          [Service]
          Type=forking

          User=tomcat
          Group=tomcat

          Environment="JAVA_HOME=/usr/lib/jvm/java-17-amazon-corretto"
          Environment="CATALINA_HOME=/opt/tomcat"
          Environment="CATALINA_BASE=/opt/tomcat"
          Environment="CATALINA_PID=/opt/tomcat/temp/tomcat.pid"

          ExecStart=/opt/tomcat/bin/startup.sh
          ExecStop=/opt/tomcat/bin/shutdown.sh

          PIDFile=/opt/tomcat/temp/tomcat.pid

          Restart=on-failure
          RestartSec=5

          TimeoutStartSec=120
          TimeoutStopSec=60

          [Install]
          WantedBy=multi-user.target

          SERVICE


          echo "======================================"
          echo "RELOAD SYSTEMD"
          echo "======================================"

          sudo systemctl daemon-reload

          sudo systemctl enable tomcat


          echo "======================================"
          echo "STOP OLD TOMCAT"
          echo "======================================"

          sudo systemctl stop tomcat || true


          echo "======================================"
          echo "START TOMCAT"
          echo "======================================"

          sudo systemctl start tomcat


          echo "======================================"
          echo "WAIT FOR TOMCAT"
          echo "======================================"

          sleep 8


          echo "======================================"
          echo "TOMCAT SERVICE STATUS"
          echo "======================================"

          sudo systemctl status tomcat --no-pager


          echo "======================================"
          echo "CHECK TOMCAT ACTIVE"
          echo "======================================"

          if ! sudo systemctl is-active --quiet tomcat; then

              echo "Tomcat failed to start."

              echo "===== SYSTEMD STATUS ====="
              sudo systemctl status tomcat --no-pager || true

              echo "===== SYSTEMD JOURNAL ====="
              sudo journalctl -u tomcat -n 100 --no-pager || true

              echo "===== CATALINA LOG ====="
              sudo tail -100 /opt/tomcat/logs/catalina.out || true

              exit 1

          fi


          echo "Tomcat is running."


          echo "======================================"
          echo "CHECK PORT 8080"
          echo "======================================"

          sudo ss -lntp | grep 8080 || true

          EOF

      # --------------------------------------------------
      # 10. Copy WAR to EC2
      # --------------------------------------------------
      - name: Copy WAR to EC2
        run: |
          scp -i ~/.ssh/ec2_key \
            target/neontask.war \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/neontask.war"

      # --------------------------------------------------
      # 11. Deploy WAR
      # --------------------------------------------------
      - name: Deploy WAR
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -e

          echo "======================================"
          echo "STOP TOMCAT BEFORE DEPLOYMENT"
          echo "======================================"

          sudo systemctl stop tomcat || true


          echo "======================================"
          echo "REMOVE OLD APPLICATION"
          echo "======================================"

          sudo rm -rf /opt/tomcat/webapps/neontask
          sudo rm -f /opt/tomcat/webapps/neontask.war


          echo "======================================"
          echo "COPY NEW WAR"
          echo "======================================"

          sudo cp /tmp/neontask.war \
            /opt/tomcat/webapps/neontask.war


          echo "======================================"
          echo "SET WAR PERMISSION"
          echo "======================================"

          sudo chown tomcat:tomcat \
            /opt/tomcat/webapps/neontask.war

          sudo chmod 644 \
            /opt/tomcat/webapps/neontask.war


          echo "======================================"
          echo "START TOMCAT"
          echo "======================================"

          sudo systemctl start tomcat


          echo "======================================"
          echo "WAIT FOR APPLICATION DEPLOYMENT"
          echo "======================================"

          for i in {1..12}
          do

              if [ -d /opt/tomcat/webapps/neontask ]; then

                  echo "Application deployed successfully."

                  break

              fi

              echo "Waiting for WAR deployment... $i/12"

              sleep 5

          done


          echo "======================================"
          echo "APPLICATION DIRECTORY"
          echo "======================================"

          sudo ls -lah /opt/tomcat/webapps/


          echo "======================================"
          echo "CHECK TOMCAT STATUS"
          echo "======================================"

          sudo systemctl status tomcat --no-pager


          echo "======================================"
          echo "TEST TOMCAT PORT"
          echo "======================================"

          curl -I http://localhost:8080 || true


          echo "======================================"
          echo "TEST APPLICATION"
          echo "======================================"

          curl -i http://localhost:8080/neontask/ || true


          echo "======================================"
          echo "CATALINA LOG"
          echo "======================================"

          sudo tail -100 /opt/tomcat/logs/catalina.out || true


          echo "======================================"
          echo "DEPLOYMENT COMPLETE"
          echo "======================================"

          EOF

      # --------------------------------------------------
      # 12. Final deployment information
      # --------------------------------------------------
      - name: Deployment Complete
        run: |
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "Open your application using:"
          echo ""
          echo "http://${{ secrets.EC2_HOST }}:8080/neontask/"
          echo ""
          echo "Make sure EC2 Security Group allows:"
          echo "TCP 8080"
          echo "Source: your IP address"
          echo "======================================"