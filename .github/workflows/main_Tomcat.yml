name: Build and Deploy Java WAR to Tomcat

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================================
  # BUILD JOB
  # ==========================================================

  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Java 17
      # --------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # --------------------------------------------------------
      # Build WAR
      # --------------------------------------------------------

      - name: Build WAR
        run: |

          echo "======================================"
          echo "BUILDING JAVA WAR"
          echo "======================================"

          mvn clean package -DskipTests


          echo "======================================"
          echo "TARGET DIRECTORY"
          echo "======================================"

          ls -lah target/


          echo "======================================"
          echo "WAR FILE"
          echo "======================================"

          ls -lh target/*.war


          if [ ! -f target/neontask.war ]; then
              echo "ERROR: neontask.war was not created."
              exit 1
          fi


          echo "WAR build successful."


      # --------------------------------------------------------
      # Upload WAR
      # --------------------------------------------------------

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neontask-war
          path: target/neontask.war


  # ==========================================================
  # DEPLOY JOB
  # ==========================================================

  deploy-tomcat:
    name: Deploy WAR to Tomcat
    needs: build
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Download WAR
      # --------------------------------------------------------

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: neontask-war
          path: target


      # --------------------------------------------------------
      # Verify WAR
      # --------------------------------------------------------

      - name: Verify WAR
        run: |

          echo "======================================"
          echo "DOWNLOADED WAR"
          echo "======================================"

          ls -lah target/


          echo "======================================"
          echo "WAR INFORMATION"
          echo "======================================"

          ls -lh target/neontask.war

          du -h target/neontask.war


          if [ ! -f target/neontask.war ]; then
              echo "ERROR: WAR file not found."
              exit 1
          fi


      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------

      - name: Configure SSH
        run: |

          mkdir -p ~/.ssh


          echo "${{ secrets.EC2_SSH_KEY }}" \
            > ~/.ssh/ec2_key


          chmod 600 ~/.ssh/ec2_key


          ssh-keyscan -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts


      # ========================================================
      # PREPARE TOMCAT
      # ========================================================

      - name: Prepare Tomcat
        run: |

          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -e


          # ==================================================
          # JAVA
          # ==================================================

          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"

          java -version


          # ==================================================
          # TOMCAT USER
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT USER"
          echo "======================================"

          if id tomcat >/dev/null 2>&1; then

              echo "Tomcat user already exists."

          else

              echo "Creating tomcat user."

              sudo useradd \
                --system \
                --home-dir /opt/tomcat \
                --shell /sbin/nologin \
                tomcat

          fi


          # ==================================================
          # TOMCAT INSTALLATION
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT INSTALLATION"
          echo "======================================"

          if [ -f /opt/tomcat/bin/catalina.sh ]; then

              echo "Tomcat already installed."
              echo "Using existing Tomcat installation."

          else

              echo "Tomcat not found."
              echo "Installing Tomcat 10.1.60."


              cd /tmp


              sudo rm -f apache-tomcat.tar.gz


              curl -fL \
                --retry 3 \
                --connect-timeout 20 \
                -o apache-tomcat.tar.gz \
                https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.60/bin/apache-tomcat-10.1.60.tar.gz


              echo "Tomcat download completed."


              sudo rm -rf /opt/apache-tomcat-10.1.60


              sudo tar \
                -xzf apache-tomcat.tar.gz \
                -C /opt


              sudo rm -rf /opt/tomcat


              sudo mv \
                /opt/apache-tomcat-10.1.60 \
                /opt/tomcat

          fi


          # ==================================================
          # VERIFY TOMCAT
          # ==================================================

          echo "======================================"
          echo "VERIFY TOMCAT FILES"
          echo "======================================"

          sudo test -f /opt/tomcat/bin/catalina.sh
          sudo test -f /opt/tomcat/bin/startup.sh
          sudo test -f /opt/tomcat/bin/shutdown.sh


          echo "Tomcat scripts found."


          # ==================================================
          # PERMISSIONS
          # ==================================================

          echo "======================================"
          echo "FIX TOMCAT PERMISSIONS"
          echo "======================================"

          sudo chown -R tomcat:tomcat /opt/tomcat


          # IMPORTANT:
          # Use find instead of *.sh

          sudo find /opt/tomcat/bin \
            -type f \
            -name "*.sh" \
            -exec chmod +x {} \;


          sudo mkdir -p /opt/tomcat/temp
          sudo mkdir -p /opt/tomcat/logs
          sudo mkdir -p /opt/tomcat/work
          sudo mkdir -p /opt/tomcat/webapps


          sudo chown -R tomcat:tomcat \
            /opt/tomcat/temp \
            /opt/tomcat/logs \
            /opt/tomcat/work \
            /opt/tomcat/webapps


          # ==================================================
          # TOMCAT VERSION
          # ==================================================

          echo "======================================"
          echo "TOMCAT VERSION"
          echo "======================================"

          sudo -u tomcat \
            /opt/tomcat/bin/catalina.sh version


          # ==================================================
          # CREATE SYSTEMD SERVICE
          # ==================================================

          echo "======================================"
          echo "CREATE TOMCAT SERVICE"
          echo "======================================"

          sudo tee /etc/systemd/system/tomcat.service > /dev/null << 'SERVICE'

          [Unit]
          Description=Apache Tomcat 10
          After=network.target

          [Service]
          Type=forking

          User=tomcat
          Group=tomcat

          Environment="JAVA_HOME=/usr/lib/jvm/java-17-amazon-corretto"
          Environment="CATALINA_HOME=/opt/tomcat"
          Environment="CATALINA_BASE=/opt/tomcat"
          Environment="CATALINA_PID=/opt/tomcat/temp/tomcat.pid"

          ExecStart=/opt/tomcat/bin/startup.sh
          ExecStop=/opt/tomcat/bin/shutdown.sh

          PIDFile=/opt/tomcat/temp/tomcat.pid

          Restart=on-failure
          RestartSec=5

          TimeoutStartSec=120
          TimeoutStopSec=60

          [Install]
          WantedBy=multi-user.target

          SERVICE


          # ==================================================
          # SYSTEMD
          # ==================================================

          echo "======================================"
          echo "RELOAD SYSTEMD"
          echo "======================================"

          sudo systemctl daemon-reload

          sudo systemctl enable tomcat


          # ==================================================
          # STOP OLD TOMCAT
          # ==================================================

          echo "======================================"
          echo "STOP OLD TOMCAT"
          echo "======================================"

          sudo systemctl stop tomcat || true


          # ==================================================
          # START TOMCAT
          # ==================================================

          echo "======================================"
          echo "START TOMCAT"
          echo "======================================"

          sudo systemctl start tomcat


          echo "Waiting for Tomcat..."

          sleep 8


          # ==================================================
          # CHECK TOMCAT SERVICE
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT SERVICE"
          echo "======================================"

          if sudo systemctl is-active --quiet tomcat; then

              echo "Tomcat service is running."

          else

              echo "Tomcat service failed."

              echo ""
              echo "===== SYSTEMD STATUS ====="

              sudo systemctl status tomcat \
                --no-pager || true


              echo ""
              echo "===== SYSTEMD JOURNAL ====="

              sudo journalctl \
                -u tomcat \
                -n 100 \
                --no-pager || true


              echo ""
              echo "===== CATALINA LOG ====="

              sudo tail -150 \
                /opt/tomcat/logs/catalina.out || true


              exit 1

          fi


          # ==================================================
          # CHECK PORT
          # ==================================================

          echo "======================================"
          echo "CHECK PORT 8080"
          echo "======================================"

          sudo ss -lntp | grep 8080 || true


          echo "Tomcat preparation completed."

          EOF


      # ========================================================
      # COPY WAR
      # ========================================================

      - name: Copy WAR to EC2
        run: |

          echo "======================================"
          echo "COPY WAR TO EC2"
          echo "======================================"


          scp -i ~/.ssh/ec2_key \
            target/neontask.war \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/neontask.war"


          echo "WAR copied successfully."


      # ========================================================
      # DEPLOY WAR
      # ========================================================

      - name: Deploy WAR to Tomcat
        run: |

          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -e


          # ==================================================
          # STOP TOMCAT
          # ==================================================

          echo "======================================"
          echo "STOP TOMCAT"
          echo "======================================"

          sudo systemctl stop tomcat || true


          # ==================================================
          # REMOVE OLD APPLICATION
          # ==================================================

          echo "======================================"
          echo "REMOVE OLD APPLICATION"
          echo "======================================"

          sudo rm -rf \
            /opt/tomcat/webapps/neontask


          sudo rm -f \
            /opt/tomcat/webapps/neontask.war


          # ==================================================
          # COPY NEW WAR
          # ==================================================

          echo "======================================"
          echo "COPY NEW WAR"
          echo "======================================"

          sudo cp \
            /tmp/neontask.war \
            /opt/tomcat/webapps/neontask.war


          # ==================================================
          # WAR PERMISSIONS
          # ==================================================

          echo "======================================"
          echo "SET WAR PERMISSIONS"
          echo "======================================"

          sudo chown \
            tomcat:tomcat \
            /opt/tomcat/webapps/neontask.war


          sudo chmod \
            644 \
            /opt/tomcat/webapps/neontask.war


          # ==================================================
          # START TOMCAT
          # ==================================================

          echo "======================================"
          echo "START TOMCAT"
          echo "======================================"

          sudo systemctl start tomcat


          echo "Waiting for Tomcat..."

          sleep 10


          # ==================================================
          # CHECK TOMCAT SERVICE
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT SERVICE"
          echo "======================================"

          if sudo systemctl is-active --quiet tomcat; then

              echo "Tomcat service is running."

          else

              echo "Tomcat service failed."

              echo ""
              echo "===== SYSTEMD STATUS ====="

              sudo systemctl status tomcat \
                --no-pager || true


              echo ""
              echo "===== SYSTEMD JOURNAL ====="

              sudo journalctl \
                -u tomcat \
                -n 100 \
                --no-pager || true


              echo ""
              echo "===== CATALINA LOG ====="

              sudo tail -150 \
                /opt/tomcat/logs/catalina.out || true


              exit 1

          fi


          # ==================================================
          # CHECK PORT 8080
          # ==================================================

          echo "======================================"
          echo "CHECK PORT 8080"
          echo "======================================"

          if curl \
            -s \
            --connect-timeout 10 \
            http://localhost:8080/ \
            > /dev/null; then

              echo "Tomcat is responding on port 8080."

          else

              echo "Tomcat is not responding."

              sudo ss -lntp || true

              exit 1

          fi


          # ==================================================
          # WAIT FOR APPLICATION
          # ==================================================

          echo "======================================"
          echo "WAIT FOR APPLICATION"
          echo "======================================"

          sleep 5


          # ==================================================
          # CHECK WAR FILE
          # ==================================================

          echo "======================================"
          echo "CHECK WAR FILE"
          echo "======================================"

          if [ -f /opt/tomcat/webapps/neontask.war ]; then

              echo "neontask.war exists."

          else

              echo "ERROR: neontask.war not found."

              exit 1

          fi


          # ==================================================
          # CHECK TOMCAT LOG FOR DEPLOYMENT
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT DEPLOYMENT LOG"
          echo "======================================"

          sudo grep \
            -i \
            "neontask" \
            /opt/tomcat/logs/catalina.out \
            | tail -20 || true


          # ==================================================
          # TEST APPLICATION
          # ==================================================

          echo "======================================"
          echo "TEST /neontask/"
          echo "======================================"

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/neontask-response.txt \
            -w "%{http_code}" \
            --connect-timeout 10 \
            http://localhost:8080/neontask/ || true)


          echo "Application HTTP status: $HTTP_CODE"


          echo "======================================"
          echo "APPLICATION RESPONSE"
          echo "======================================"

          cat /tmp/neontask-response.txt || true


          # ==================================================
          # WEBAPPS DIRECTORY
          # ==================================================

          echo "======================================"
          echo "TOMCAT WEBAPPS"
          echo "======================================"

          sudo ls -lah \
            /opt/tomcat/webapps/


          # ==================================================
          # CATALINA LOG
          # ==================================================

          echo "======================================"
          echo "CATALINA LOG"
          echo "======================================"

          sudo tail -150 \
            /opt/tomcat/logs/catalina.out || true


          # ==================================================
          # FINAL RESULT
          # ==================================================

          echo "======================================"
          echo "DEPLOYMENT COMPLETED"
          echo "======================================"

          echo ""
          echo "Tomcat is running."
          echo "WAR file is deployed."
          echo "Application context: /neontask"
          echo ""

          EOF


      # ========================================================
      # FINAL MESSAGE
      # ========================================================

      - name: Deployment Complete
        run: |

          echo ""
          echo "=============================================="
          echo "       DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=============================================="
          echo ""

          echo "Application URL:"
          echo ""

          echo "http://${{ secrets.EC2_HOST }}:8080/neontask/"

          echo ""

          echo "Tomcat URL:"
          echo ""

          echo "http://${{ secrets.EC2_HOST }}:8080/"

          echo ""

          echo "Tomcat Port: 8080"

          echo ""

          echo "Make sure EC2 Security Group allows:"
          echo ""
          echo "Protocol : TCP"
          echo "Port     : 8080"
          echo "Source   : Your IP address"

          echo ""
          echo "=============================================="