name: Build and Deploy Java WAR to Tomcat

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  deploy-tomcat:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout Repository
      # =====================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # =====================================================
      # 2. Setup Java on GitHub Runner
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # =====================================================
      # 3. Build WAR File
      # =====================================================

      - name: Build WAR
        run: |

          echo "=========================================="
          echo "Building Java WAR"
          echo "=========================================="

          mvn clean package -DskipTests

          echo "=========================================="
          echo "Generated WAR Files"
          echo "=========================================="

          ls -lh target/*.war


      # =====================================================
      # 4. Connect to EC2
      # =====================================================

      - name: Install and Configure Tomcat
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            set -e

            echo "=========================================="
            echo "Java Version"
            echo "=========================================="

            java -version


            # =================================================
            # Create Tomcat User
            # =================================================

            echo "=========================================="
            echo "Creating Tomcat User"
            echo "=========================================="

            if ! id tomcat >/dev/null 2>&1; then

              sudo useradd -r -m -U \
                -d /opt/tomcat \
                -s /bin/false \
                tomcat

            else

              echo "Tomcat user already exists."

            fi


            # =================================================
            # Install Tomcat Only If Needed
            # =================================================

            if [ ! -f /opt/tomcat/bin/startup.sh ]; then

              echo "=========================================="
              echo "Installing Tomcat"
              echo "=========================================="

              cd /tmp

              sudo rm -f apache-tomcat-10.1.60.tar.gz

              sudo curl -fL -O \
                https://dlcdn.apache.org/tomcat/tomcat-10/v10.1.60/bin/apache-tomcat-10.1.60.tar.gz


              echo "=========================================="
              echo "Removing Old Tomcat Directory"
              echo "=========================================="

              sudo rm -rf /opt/tomcat

              sudo mkdir -p /opt/tomcat


              echo "=========================================="
              echo "Extracting Tomcat"
              echo "=========================================="

              sudo tar -xzf apache-tomcat-10.1.60.tar.gz \
                --strip-components=1 \
                -C /opt/tomcat


              echo "=========================================="
              echo "Checking Tomcat Files"
              echo "=========================================="

              sudo ls -lah /opt/tomcat

              echo "Tomcat bin directory:"

              sudo ls -lah /opt/tomcat/bin


              # =================================================
              # Verify Tomcat Installation
              # =================================================

              if [ ! -f /opt/tomcat/bin/startup.sh ]; then

                echo "=========================================="
                echo "ERROR: Tomcat Installation Failed"
                echo "=========================================="

                sudo find /opt/tomcat -maxdepth 2 -type f | head -100

                exit 1

              fi

            else

              echo "=========================================="
              echo "Tomcat Already Installed"
              echo "=========================================="

            fi


            # =================================================
            # Tomcat Permissions
            # =================================================

            echo "=========================================="
            echo "Setting Tomcat Permissions"
            echo "=========================================="

            sudo chown -R tomcat:tomcat /opt/tomcat

            sudo chmod +x /opt/tomcat/bin/*.sh


            # =================================================
            # Configure Tomcat Users
            # =================================================

            echo "=========================================="
            echo "Configuring Tomcat Users"
            echo "=========================================="

            sudo tee /opt/tomcat/conf/tomcat-users.xml > /dev/null <<'EOF'

            <?xml version="1.0" encoding="UTF-8"?>

            <tomcat-users
                xmlns="http://tomcat.apache.org/xml"
                xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                xsi:schemaLocation="http://tomcat.apache.org/xml tomcat-users.xsd"
                version="1.0">

                <role rolename="manager-gui"/>
                <role rolename="manager-script"/>
                <role rolename="manager-jmx"/>
                <role rolename="manager-status"/>

                <role rolename="admin-gui"/>
                <role rolename="admin-script"/>

                <user username="admin"
                      password="${{ secrets.TOMCAT_PASSWORD }}"
                      roles="manager-gui,manager-script,manager-jmx,manager-status,admin-gui,admin-script"/>

            </tomcat-users>

            EOF


            # =================================================
            # Configure Manager
            # =================================================

            echo "=========================================="
            echo "Configuring Tomcat Manager"
            echo "=========================================="

            sudo tee /opt/tomcat/webapps/manager/META-INF/context.xml > /dev/null <<'EOF'

            <?xml version="1.0" encoding="UTF-8"?>

            <Context privileged="true">

                <CookieProcessor sameSiteCookies="strict" />

            </Context>

            EOF


            # =================================================
            # Configure Host Manager
            # =================================================

            echo "=========================================="
            echo "Configuring Host Manager"
            echo "=========================================="

            sudo tee /opt/tomcat/webapps/host-manager/META-INF/context.xml > /dev/null <<'EOF'

            <?xml version="1.0" encoding="UTF-8"?>

            <Context privileged="true">

                <CookieProcessor sameSiteCookies="strict" />

            </Context>

            EOF


            # =================================================
            # Create Systemd Service
            # =================================================

            echo "=========================================="
            echo "Creating Tomcat Systemd Service"
            echo "=========================================="

            sudo tee /etc/systemd/system/tomcat.service > /dev/null <<'EOF'

            [Unit]
            Description=Apache Tomcat Web Application Container
            After=network.target

            [Service]

            Type=forking

            User=tomcat
            Group=tomcat

            Environment="JAVA_HOME=/usr/lib/jvm/java-17-amazon-corretto"
            Environment="CATALINA_HOME=/opt/tomcat"
            Environment="CATALINA_BASE=/opt/tomcat"
            Environment="CATALINA_PID=/opt/tomcat/temp/tomcat.pid"

            ExecStart=/opt/tomcat/bin/startup.sh
            ExecStop=/opt/tomcat/bin/shutdown.sh

            Restart=on-failure

            [Install]
            WantedBy=multi-user.target

            EOF


            # =================================================
            # Start Tomcat
            # =================================================

            echo "=========================================="
            echo "Starting Tomcat"
            echo "=========================================="

            sudo systemctl daemon-reload

            sudo systemctl enable tomcat

            sudo systemctl restart tomcat

            sleep 10


            # =================================================
            # Check Tomcat Status
            # =================================================

            echo "=========================================="
            echo "Tomcat Status"
            echo "=========================================="

            sudo systemctl status tomcat --no-pager


            # =================================================
            # Check Port 8080
            # =================================================

            echo "=========================================="
            echo "Checking Port 8080"
            echo "=========================================="

            sudo ss -lntp | grep 8080 || true


            # =================================================
            # Test Tomcat ROOT
            # =================================================

            echo "=========================================="
            echo "Testing Tomcat ROOT"
            echo "=========================================="

            curl -I http://localhost:8080/ || true


      # =====================================================
      # 5. Copy WAR to EC2
      # =====================================================

      - name: Copy WAR to EC2
        uses: appleboy/scp-action@v0.1.7

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          source: "target/neontask.war"

          target: "/tmp/"


      # =====================================================
      # 6. Deploy WAR
      # =====================================================

      - name: Deploy WAR to Tomcat
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            set -e

            echo "=========================================="
            echo "Deploying neontask.war"
            echo "=========================================="


            # =================================================
            # Remove Previous Application
            # =================================================

            echo "Removing previous deployment..."

            sudo rm -rf /opt/tomcat/webapps/neontask

            sudo rm -f /opt/tomcat/webapps/neontask.war


            # =================================================
            # Copy New WAR
            # =================================================

            echo "Copying new WAR..."

            sudo cp \
              /tmp/neontask.war \
              /opt/tomcat/webapps/neontask.war


            # =================================================
            # Set Ownership
            # =================================================

            sudo chown tomcat:tomcat \
              /opt/tomcat/webapps/neontask.war


            echo "WAR copied successfully."


            # =================================================
            # Restart Tomcat
            # =================================================

            echo "=========================================="
            echo "Restarting Tomcat"
            echo "=========================================="

            sudo systemctl restart tomcat


            echo "Waiting for Tomcat deployment..."

            sleep 15


            # =================================================
            # Check Tomcat Status
            # =================================================

            echo "=========================================="
            echo "Tomcat Status"
            echo "=========================================="

            sudo systemctl status tomcat --no-pager


            # =================================================
            # Check Webapps Directory
            # =================================================

            echo "=========================================="
            echo "Tomcat Webapps Directory"
            echo "=========================================="

            sudo ls -lah /opt/tomcat/webapps/


            # =================================================
            # Check WAR File
            # =================================================

            echo "=========================================="
            echo "Checking WAR"
            echo "=========================================="

            if [ ! -f /opt/tomcat/webapps/neontask.war ]; then

              echo "ERROR: neontask.war was not copied."

              exit 1

            fi

            sudo ls -lh \
              /opt/tomcat/webapps/neontask.war


            # =================================================
            # Check Application Directory
            # =================================================

            echo "=========================================="
            echo "Checking Extracted Application"
            echo "=========================================="

            if [ -d /opt/tomcat/webapps/neontask ]; then

              echo "Application directory exists."

              sudo ls -lah \
                /opt/tomcat/webapps/neontask

            else

              echo "=========================================="
              echo "ERROR: Application Was Not Deployed"
              echo "=========================================="

              echo "Tomcat logs:"

              sudo tail -100 \
                /opt/tomcat/logs/catalina.out

              exit 1

            fi


            # =================================================
            # Check Application Contents
            # =================================================

            echo "=========================================="
            echo "Application Contents"
            echo "=========================================="

            sudo find \
              /opt/tomcat/webapps/neontask \
              -maxdepth 2 \
              -type f \
              | head -100


            # =================================================
            # Test Tomcat
            # =================================================

            echo "=========================================="
            echo "Testing Tomcat"
            echo "=========================================="

            curl -I \
              http://localhost:8080/


            # =================================================
            # Test Application
            # =================================================

            echo "=========================================="
            echo "Testing neontask Application"
            echo "=========================================="

            HTTP_STATUS=$(curl -s -o /tmp/neontask_response.txt \
              -w "%{http_code}" \
              http://localhost:8080/neontask/)

            echo "HTTP Status: $HTTP_STATUS"


            if [ "$HTTP_STATUS" = "200" ] || \
               [ "$HTTP_STATUS" = "302" ] || \
               [ "$HTTP_STATUS" = "301" ]
            then

              echo "=========================================="
              echo "APPLICATION DEPLOYED SUCCESSFULLY"
              echo "=========================================="

            else

              echo "=========================================="
              echo "APPLICATION RETURNED HTTP $HTTP_STATUS"
              echo "=========================================="

              echo "Response:"

              cat /tmp/neontask_response.txt

              echo ""
              echo "Tomcat logs:"

              sudo tail -100 \
                /opt/tomcat/logs/catalina.out

              exit 1

            fi


            # =================================================
            # Final
            # =================================================

            echo "=========================================="
            echo "DEPLOYMENT COMPLETED"
            echo "=========================================="

            echo "Application URL:"

            echo "http://${{ secrets.EC2_HOST }}:8080/neontask/"