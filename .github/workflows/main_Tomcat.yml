name: Build and Deploy Java WAR to Tomcat

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================================
  # BUILD JOB
  # ==========================================================

  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Java 17
      # --------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # --------------------------------------------------------
      # Build WAR
      # --------------------------------------------------------

      - name: Build WAR
        run: |

          echo "======================================"
          echo "BUILDING JAVA WAR"
          echo "======================================"

          mvn clean package -DskipTests


          echo "======================================"
          echo "TARGET DIRECTORY"
          echo "======================================"

          ls -lah target/


          echo "======================================"
          echo "WAR FILE"
          echo "======================================"

          ls -lh target/*.war


          if [ ! -f target/neontask.war ]; then
              echo "ERROR: neontask.war was not created."
              exit 1
          fi


          echo "WAR BUILD SUCCESSFUL"


      # --------------------------------------------------------
      # Upload WAR
      # --------------------------------------------------------

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neontask-war
          path: target/neontask.war


  # ==========================================================
  # DEPLOY JOB
  # ==========================================================

  deploy-tomcat:
    name: Deploy WAR to Tomcat
    needs: build
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Download WAR
      # --------------------------------------------------------

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: neontask-war
          path: target


      # --------------------------------------------------------
      # Verify WAR
      # --------------------------------------------------------

      - name: Verify WAR
        run: |

          echo "======================================"
          echo "DOWNLOADED WAR"
          echo "======================================"

          ls -lah target/


          echo "======================================"
          echo "WAR INFORMATION"
          echo "======================================"

          ls -lh target/neontask.war

          du -h target/neontask.war


          if [ ! -f target/neontask.war ]; then
              echo "ERROR: WAR file not found."
              exit 1
          fi


      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------

      - name: Configure SSH
        run: |

          mkdir -p ~/.ssh


          echo "${{ secrets.EC2_SSH_KEY }}" \
            > ~/.ssh/ec2_key


          chmod 600 ~/.ssh/ec2_key


          ssh-keyscan -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts


      # ========================================================
      # PREPARE TOMCAT
      # ========================================================

      - name: Prepare Tomcat
        run: |

          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -e


          # ==================================================
          # JAVA
          # ==================================================

          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"

          java -version


          # ==================================================
          # TOMCAT USER
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT USER"
          echo "======================================"

          if id tomcat >/dev/null 2>&1; then

              echo "Tomcat user already exists."

          else

              echo "Creating tomcat user."

              sudo useradd \
                --system \
                --home-dir /opt/tomcat \
                --shell /sbin/nologin \
                tomcat

          fi


          # ==================================================
          # TOMCAT INSTALLATION
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT INSTALLATION"
          echo "======================================"

          if [ -f /opt/tomcat/bin/catalina.sh ]; then

              echo "Tomcat already installed."
              echo "Using existing Tomcat installation."

          else

              echo "Tomcat not found."
              echo "Installing Tomcat 10.1.60."


              cd /tmp


              sudo rm -f apache-tomcat.tar.gz


              curl -fL \
                --retry 3 \
                --connect-timeout 20 \
                -o apache-tomcat.tar.gz \
                https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.60/bin/apache-tomcat-10.1.60.tar.gz


              echo "Tomcat download completed."


              sudo rm -rf /opt/apache-tomcat-10.1.60


              sudo tar \
                -xzf apache-tomcat.tar.gz \
                -C /opt

              sudo rm -rf /opt/tomcat

              sudo mv \
                /opt/apache-tomcat-10.1.60 \
                /opt/tomcat

              echo "======================================"
              echo "VERIFY TOMCAT WEB APPLICATIONS"
              echo "======================================"

              sudo ls -lah /opt/tomcat/webapps/

              echo "======================================"
              echo "CHECK MANAGER APPLICATION"
              echo "======================================"

              if [ -d /opt/tomcat/webapps/manager ]; then
                  echo "Tomcat Manager exists."
              else
                  echo "Tomcat Manager not found."
                  echo "Downloading Manager webapp..."

                  cd /tmp

                  curl -fL \
                    --retry 3 \
                    --connect-timeout 20 \
                    -o tomcat-webapps.tar.gz \
                    https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.60/bin/apache-tomcat-10.1.60.tar.gz

                  sudo tar \
                    -xzf tomcat-webapps.tar.gz \
                    -C /tmp

                  sudo cp -r \
                    /tmp/apache-tomcat-10.1.60/webapps/manager \
                    /opt/tomcat/webapps/

                  sudo cp -r \
                    /tmp/apache-tomcat-10.1.60/webapps/host-manager \
                    /opt/tomcat/webapps/

                  sudo rm -rf /tmp/apache-tomcat-10.1.60

                  echo "Manager and Host Manager copied."
              fi

          fi


          # ==================================================
          # VERIFY TOMCAT
          # ==================================================

          echo "======================================"
          echo "VERIFY TOMCAT FILES"
          echo "======================================"

          sudo test -f /opt/tomcat/bin/catalina.sh
          sudo test -f /opt/tomcat/bin/startup.sh
          sudo test -f /opt/tomcat/bin/shutdown.sh


          echo "Tomcat scripts found."


          # ==================================================
          # PERMISSIONS
          # ==================================================

          echo "======================================"
          echo "FIX TOMCAT PERMISSIONS"
          echo "======================================"

          sudo chown -R tomcat:tomcat /opt/tomcat


          # Use find instead of *.sh
          sudo find /opt/tomcat/bin \
            -type f \
            -name "*.sh" \
            -exec chmod +x {} \;


          sudo mkdir -p /opt/tomcat/temp
          sudo mkdir -p /opt/tomcat/logs
          sudo mkdir -p /opt/tomcat/work
          sudo mkdir -p /opt/tomcat/webapps


          sudo chown -R tomcat:tomcat \
            /opt/tomcat/temp \
            /opt/tomcat/logs \
            /opt/tomcat/work \
            /opt/tomcat/webapps


          # ==================================================
          # TOMCAT VERSION
          # ==================================================

          echo "======================================"
          echo "TOMCAT VERSION"
          echo "======================================"

          sudo -u tomcat \
            /opt/tomcat/bin/catalina.sh version


          # ==================================================
          # TOMCAT USERS
          # ==================================================

          echo "======================================"
          echo "CONFIGURE TOMCAT ADMIN USER"
          echo "======================================"

          sudo tee /opt/tomcat/conf/tomcat-users.xml > /dev/null << 'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <tomcat-users
              xmlns="http://tomcat.apache.org/xml"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://tomcat.apache.org/xml tomcat-users.xsd"
              version="1.0">

              <role rolename="manager-gui"/>
              <role rolename="admin-gui"/>

              <user
                  username="admin"
                  password="Admin#123456"
                  roles="manager-gui,admin-gui"/>

          </tomcat-users>
          XML

          sudo chown tomcat:tomcat /opt/tomcat/conf/tomcat-users.xml
          sudo chmod 640 /opt/tomcat/conf/tomcat-users.xml

          # ==================================================
          # CHECK MANAGER APPLICATION
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT MANAGER"
          echo "======================================"

          if [ -d /opt/tomcat/webapps/manager ]; then
              echo "Tomcat Manager exists."
          else
              echo "ERROR: Tomcat Manager application not found."
              echo "Expected: /opt/tomcat/webapps/manager"
              exit 1
          fi

          # ==================================================
          # CHECK HOST MANAGER APPLICATION
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT HOST MANAGER"
          echo "======================================"

          if [ -d /opt/tomcat/webapps/host-manager ]; then
              echo "Tomcat Host Manager exists."
          else
              echo "ERROR: Tomcat Host Manager application not found."
              echo "Expected: /opt/tomcat/webapps/host-manager"
              exit 1
          fi

          # ==================================================
          # MANAGER REMOTE ACCESS
          # ==================================================

          echo "======================================"
          echo "CONFIGURE MANAGER REMOTE ACCESS"
          echo "======================================"

          MANAGER_CONTEXT="/opt/tomcat/webapps/manager/META-INF/context.xml"

          if [ -f "$MANAGER_CONTEXT" ]; then

              echo "Manager context.xml found."

              sudo cp "$MANAGER_CONTEXT" "${MANAGER_CONTEXT}.backup"

              sudo sed -i \
                '/RemoteAddrValve/d' \
                "$MANAGER_CONTEXT"

              sudo sed -i \
                '/RemoteCIDRValve/d' \
                "$MANAGER_CONTEXT"

              echo "Manager remote access restriction removed."

          else

              echo "Manager context.xml does not exist."
              echo "Creating Manager context.xml."

              sudo mkdir -p \
                /opt/tomcat/webapps/manager/META-INF

              sudo tee "$MANAGER_CONTEXT" > /dev/null << 'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <Context>
          </Context>
          XML

          fi

          # ==================================================
          # HOST MANAGER REMOTE ACCESS
          # ==================================================

          echo "======================================"
          echo "CONFIGURE HOST MANAGER REMOTE ACCESS"
          echo "======================================"

          HOST_MANAGER_CONTEXT="/opt/tomcat/webapps/host-manager/META-INF/context.xml"

          if [ -f "$HOST_MANAGER_CONTEXT" ]; then

              echo "Host Manager context.xml found."

              sudo cp "$HOST_MANAGER_CONTEXT" "${HOST_MANAGER_CONTEXT}.backup"

              sudo sed -i \
                '/RemoteAddrValve/d' \
                "$HOST_MANAGER_CONTEXT"

              sudo sed -i \
                '/RemoteCIDRValve/d' \
                "$HOST_MANAGER_CONTEXT"

              echo "Host Manager remote access restriction removed."

          else

              echo "Host Manager context.xml does not exist."
              echo "Creating Host Manager context.xml."

              sudo mkdir -p \
                /opt/tomcat/webapps/host-manager/META-INF

              sudo tee "$HOST_MANAGER_CONTEXT" > /dev/null << 'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <Context>
          </Context>
          XML

          fi

          # ==================================================
          # FIX OWNERSHIP
          # ==================================================

          echo "======================================"
          echo "FIX TOMCAT OWNERSHIP"
          echo "======================================"

          sudo chown -R tomcat:tomcat /opt/tomcat/conf
          sudo chown -R tomcat:tomcat /opt/tomcat/webapps

          # ==================================================
          # VERIFY TOMCAT USER CONFIG
          # ==================================================

          echo "======================================"
          echo "VERIFY TOMCAT USERS"
          echo "======================================"

          sudo grep -E \
            'manager-gui|admin-gui|username="admin"' \
            /opt/tomcat/conf/tomcat-users.xml || true

          # ==================================================
          # VERIFY MANAGER CONTEXT
          # ==================================================

          echo "======================================"
          echo "MANAGER CONTEXT"
          echo "======================================"

          sudo cat \
            /opt/tomcat/webapps/manager/META-INF/context.xml

          # ==================================================
          # VERIFY HOST MANAGER CONTEXT
          # ==================================================

          echo "======================================"
          echo "HOST MANAGER CONTEXT"
          echo "======================================"

          sudo cat \
            /opt/tomcat/webapps/host-manager/META-INF/context.xml
          # ==================================================
          # SHOW MANAGER CONFIG
          # ==================================================

          echo "======================================"
          echo "MANAGER CONTEXT"
          echo "======================================"

          sudo cat \
            /opt/tomcat/webapps/manager/META-INF/context.xml \
            || true


          echo "======================================"
          echo "HOST MANAGER CONTEXT"
          echo "======================================"

          sudo cat \
            /opt/tomcat/webapps/host-manager/META-INF/context.xml \
            || true


          # ==================================================
          # CREATE SYSTEMD SERVICE
          # ==================================================

          echo "======================================"
          echo "CREATE TOMCAT SERVICE"
          echo "======================================"

          sudo tee /etc/systemd/system/tomcat.service > /dev/null << 'SERVICE'

          [Unit]
          Description=Apache Tomcat 10
          After=network.target

          [Service]
          Type=forking

          User=tomcat
          Group=tomcat

          Environment="JAVA_HOME=/usr/lib/jvm/java-17-amazon-corretto"
          Environment="CATALINA_HOME=/opt/tomcat"
          Environment="CATALINA_BASE=/opt/tomcat"
          Environment="CATALINA_PID=/opt/tomcat/temp/tomcat.pid"

          ExecStart=/opt/tomcat/bin/startup.sh
          ExecStop=/opt/tomcat/bin/shutdown.sh

          PIDFile=/opt/tomcat/temp/tomcat.pid

          Restart=on-failure
          RestartSec=5

          TimeoutStartSec=120
          TimeoutStopSec=60

          [Install]
          WantedBy=multi-user.target

          SERVICE


          # ==================================================
          # SYSTEMD
          # ==================================================

          echo "======================================"
          echo "RELOAD SYSTEMD"
          echo "======================================"

          sudo systemctl daemon-reload

          sudo systemctl enable tomcat


          # ==================================================
          # STOP OLD TOMCAT
          # ==================================================

          echo "======================================"
          echo "STOP OLD TOMCAT"
          echo "======================================"

          sudo systemctl stop tomcat || true


          # ==================================================
          # START TOMCAT
          # ==================================================

          echo "======================================"
          echo "START TOMCAT"
          echo "======================================"

          sudo systemctl start tomcat


          echo "Waiting for Tomcat..."

          sleep 10


          # ==================================================
          # CHECK TOMCAT
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT SERVICE"
          echo "======================================"

          if sudo systemctl is-active --quiet tomcat; then

              echo "Tomcat service is running."

          else

              echo "Tomcat service failed."

              echo ""
              echo "===== SYSTEMD STATUS ====="

              sudo systemctl status tomcat \
                --no-pager || true


              echo ""
              echo "===== SYSTEMD JOURNAL ====="

              sudo journalctl \
                -u tomcat \
                -n 100 \
                --no-pager || true


              echo ""
              echo "===== CATALINA LOG ====="

              sudo tail -150 \
                /opt/tomcat/logs/catalina.out || true


              exit 1

          fi


          # ==================================================
          # CHECK PORT
          # ==================================================

          echo "======================================"
          echo "CHECK PORT 8080"
          echo "======================================"

          sudo ss -lntp | grep 8080 || true


          echo "Tomcat preparation completed."

          EOF


      # ========================================================
      # COPY WAR
      # ========================================================

      - name: Copy WAR to EC2
        run: |

          echo "======================================"
          echo "COPY WAR TO EC2"
          echo "======================================"


          scp -i ~/.ssh/ec2_key \
            target/neontask.war \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/neontask.war"


          echo "WAR copied successfully."


      # ========================================================
      # DEPLOY WAR
      # ========================================================

      - name: Deploy WAR to Tomcat
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          echo "======================================"
          echo "STOP TOMCAT"
          echo "======================================"

          sudo systemctl stop tomcat || true

          echo "======================================"
          echo "REMOVE OLD APPLICATION"
          echo "======================================"

          sudo rm -rf /opt/tomcat/webapps/neontask
          sudo rm -f /opt/tomcat/webapps/neontask.war

          echo "======================================"
          echo "CHECK SOURCE WAR"
          echo "======================================"

          if [ ! -f /tmp/neontask.war ]; then
              echo "ERROR: /tmp/neontask.war not found."
              exit 1
          fi

          ls -lh /tmp/neontask.war

          echo "======================================"
          echo "COPY NEW WAR"
          echo "======================================"

          sudo cp /tmp/neontask.war /opt/tomcat/webapps/neontask.war

          echo "======================================"
          echo "VERIFY WAR COPY"
          echo "======================================"

          ls -lh /opt/tomcat/webapps/neontask.war

          echo "======================================"
          echo "SET WAR PERMISSIONS"
          echo "======================================"

          sudo chown tomcat:tomcat /opt/tomcat/webapps/neontask.war
          sudo chmod 644 /opt/tomcat/webapps/neontask.war

          echo "======================================"
          echo "START TOMCAT"
          echo "======================================"

          sudo systemctl start tomcat

          echo "Waiting for Tomcat..."
          sleep 10

          echo "======================================"
          echo "CHECK TOMCAT SERVICE"
          echo "======================================"

          if sudo systemctl is-active --quiet tomcat; then
              echo "Tomcat service is running."
          else
              echo "Tomcat service failed."
              sudo systemctl status tomcat --no-pager || true
              sudo journalctl -u tomcat -n 100 --no-pager || true
              sudo tail -150 /opt/tomcat/logs/catalina.out || true
              exit 1
          fi

          echo "======================================"
          echo "CHECK PORT 8080"
          echo "======================================"

          if sudo ss -lntp | grep -q 8080; then
              echo "Port 8080 is listening."
          else
              echo "Port 8080 is NOT listening."
              exit 1
          fi

          echo "======================================"
          echo "WAIT FOR APPLICATION DEPLOYMENT"
          echo "======================================"

          sleep 15

          echo "======================================"
          echo "CHECK WEBAPPS DIRECTORY"
          echo "======================================"

          sudo ls -lah /opt/tomcat/webapps/

          echo "======================================"
          echo "CHECK NEONTASK DIRECTORY"
          echo "======================================"

          if [ -d /opt/tomcat/webapps/neontask ]; then
              echo "neontask application directory exists."
          else
              echo "WARNING: neontask directory does not exist yet."
          fi

          echo "======================================"
          echo "CHECK NEONTASK WAR"
          echo "======================================"

          if [ -f /opt/tomcat/webapps/neontask.war ]; then
              echo "neontask.war exists."
              ls -lh /opt/tomcat/webapps/neontask.war
          else
              echo "WARNING: neontask.war is not present."
              echo "This is not treated as an immediate failure."
          fi

          echo "======================================"
          echo "CHECK TOMCAT DEPLOYMENT LOG"
          echo "======================================"

          sudo grep -i -E \
            "neontask|Deploying web application|Deployment of web application|SEVERE|ERROR" \
            /opt/tomcat/logs/catalina.out | tail -100 || true

          echo "======================================"
          echo "TEST TOMCAT ROOT"
          echo "======================================"

          ROOT_CODE=$(curl -s --max-time 10 \
            -o /tmp/tomcat-root.html \
            -w "%{http_code}" \
            http://localhost:8080/ || true)

          echo "Tomcat root HTTP status: $ROOT_CODE"

          echo "======================================"
          echo "TEST NEONTASK APPLICATION"
          echo "======================================"

          APP_CODE=$(curl -s --max-time 20 \
            -o /tmp/neontask-response.html \
            -w "%{http_code}" \
            http://localhost:8080/neontask/ || true)

          echo "Neontask HTTP status: $APP_CODE"

          echo "======================================"
          echo "APPLICATION RESPONSE"
          echo "======================================"

          cat /tmp/neontask-response.html | head -100 || true

          echo "======================================"
          echo "FINAL DEPLOYMENT CHECK"
          echo "======================================"

          if [ "$APP_CODE" = "200" ] || [ "$APP_CODE" = "302" ] || [ "$APP_CODE" = "301" ]; then
              echo "======================================"
              echo "APPLICATION DEPLOYMENT SUCCESSFUL"
              echo "======================================"
              echo "HTTP Status: $APP_CODE"
              echo "Application: /neontask"
          else
              echo "======================================"
              echo "APPLICATION DEPLOYMENT FAILED"
              echo "======================================"
              echo "HTTP Status: $APP_CODE"

              echo ""
              echo "Last Tomcat logs:"
              sudo tail -200 /opt/tomcat/logs/catalina.out || true

              exit 1
          fi

          echo "======================================"
          echo "DEPLOYMENT COMPLETED"
          echo "======================================"

          EOF

      # ========================================================
      # FINAL MESSAGE
      # ========================================================

      - name: Deployment Complete
        run: |

          echo ""
          echo "================================================"
          echo "       DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "================================================"
          echo ""

          echo "YOUR JAVA APPLICATION:"
          echo ""

          echo "http://${{ secrets.EC2_HOST }}:8080/neontask/"
          echo ""

          echo "TOMCAT MANAGER:"
          echo ""

          echo "http://${{ secrets.EC2_HOST }}:8080/manager/html"
          echo ""

          echo "TOMCAT HOST MANAGER:"
          echo ""

          echo "http://${{ secrets.EC2_HOST }}:8080/host-manager/html"
          echo ""

          echo "LOGIN:"
          echo ""

          echo "Username: admin"
          echo "Password: Admin#123456"
          echo ""

          echo "TOMCAT:"
          echo ""

          echo "http://${{ secrets.EC2_HOST }}:8080/"
          echo ""

          echo "PORT:"
          echo "8080"
          echo ""

          echo "Make sure EC2 Security Group allows:"
          echo "TCP 8080 from your IP."
          echo ""

          echo "================================================"