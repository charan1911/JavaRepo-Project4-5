name: Build and Deploy Java WAR to Tomcat

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================================
  # BUILD
  # ==========================================================

  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Java 17
      # --------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # --------------------------------------------------------
      # Maven Build
      # --------------------------------------------------------

      - name: Build WAR
        run: |

          echo "======================================"
          echo "BUILDING JAVA WAR"
          echo "======================================"

          mvn clean package -DskipTests


          echo "======================================"
          echo "TARGET DIRECTORY"
          echo "======================================"

          ls -lah target/


          echo "======================================"
          echo "WAR FILE"
          echo "======================================"

          ls -lh target/*.war


          test -f target/neontask.war


      # --------------------------------------------------------
      # Upload WAR
      # --------------------------------------------------------

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neontask-war
          path: target/neontask.war


  # ==========================================================
  # DEPLOY
  # ==========================================================

  deploy-tomcat:
    name: Deploy WAR to Tomcat
    needs: build
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Download WAR
      # --------------------------------------------------------

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: neontask-war
          path: target


      # --------------------------------------------------------
      # Verify WAR
      # --------------------------------------------------------

      - name: Verify WAR
        run: |

          echo "======================================"
          echo "DOWNLOADED WAR"
          echo "======================================"

          ls -lah target/


          echo "======================================"
          echo "WAR SIZE"
          echo "======================================"

          du -h target/neontask.war


          test -f target/neontask.war


      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------

      - name: Configure SSH
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts


      # --------------------------------------------------------
      # Prepare Tomcat
      # --------------------------------------------------------

      - name: Prepare Tomcat
        run: |

          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -e


          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"

          java -version


          # ==================================================
          # TOMCAT USER
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT USER"
          echo "======================================"

          if id tomcat >/dev/null 2>&1; then

              echo "tomcat user already exists."

          else

              echo "Creating tomcat user."

              sudo useradd \
                --system \
                --home-dir /opt/tomcat \
                --shell /sbin/nologin \
                tomcat

          fi


          # ==================================================
          # TOMCAT INSTALLATION
          # ==================================================

          echo "======================================"
          echo "CHECK TOMCAT INSTALLATION"
          echo "======================================"

          if [ -f /opt/tomcat/bin/catalina.sh ]; then

              echo "Tomcat already installed."

          else

              echo "Tomcat not found."
              echo "Installing Tomcat 10.1.60."


              cd /tmp


              sudo rm -f apache-tomcat.tar.gz


              curl -fL \
                --retry 3 \
                --connect-timeout 20 \
                -o apache-tomcat.tar.gz \
                https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.60/bin/apache-tomcat-10.1.60.tar.gz


              echo "Tomcat download completed."


              sudo rm -rf /opt/apache-tomcat-10.1.60


              sudo tar \
                -xzf apache-tomcat.tar.gz \
                -C /opt


              sudo rm -rf /opt/tomcat


              sudo mv \
                /opt/apache-tomcat-10.1.60 \
                /opt/tomcat

          fi


          # ==================================================
          # VERIFY TOMCAT FILES
          # ==================================================

          echo "======================================"
          echo "VERIFY TOMCAT FILES"
          echo "======================================"

          sudo test -f /opt/tomcat/bin/catalina.sh
          sudo test -f /opt/tomcat/bin/startup.sh
          sudo test -f /opt/tomcat/bin/shutdown.sh

          echo "Tomcat scripts found."


          # ==================================================
          # PERMISSIONS
          # ==================================================

          echo "======================================"
          echo "FIX TOMCAT PERMISSIONS"
          echo "======================================"

          sudo chown -R tomcat:tomcat /opt/tomcat


          # IMPORTANT:
          # Do NOT use:
          # chmod +x /opt/tomcat/bin/*.sh
          #
          # Use find instead.

          sudo find /opt/tomcat/bin \
            -type f \
            -name "*.sh" \
            -exec chmod +x {} \;


          sudo mkdir -p /opt/tomcat/temp
          sudo mkdir -p /opt/tomcat/logs
          sudo mkdir -p /opt/tomcat/work
          sudo mkdir -p /opt/tomcat/webapps


          sudo chown -R tomcat:tomcat \
            /opt/tomcat/temp \
            /opt/tomcat/logs \
            /opt/tomcat/work \
            /opt/tomcat/webapps


          # ==================================================
          # TOMCAT VERSION
          # ==================================================

          echo "======================================"
          echo "TOMCAT VERSION"
          echo "======================================"

          sudo -u tomcat \
            /opt/tomcat/bin/catalina.sh version


          # ==================================================
          # SYSTEMD SERVICE
          # ==================================================

          echo "======================================"
          echo "CREATE TOMCAT SYSTEMD SERVICE"
          echo "======================================"

          sudo tee /etc/systemd/system/tomcat.service > /dev/null << 'SERVICE'

          [Unit]
          Description=Apache Tomcat 10
          After=network.target

          [Service]
          Type=forking

          User=tomcat
          Group=tomcat

          Environment="JAVA_HOME=/usr/lib/jvm/java-17-amazon-corretto"
          Environment="CATALINA_HOME=/opt/tomcat"
          Environment="CATALINA_BASE=/opt/tomcat"
          Environment="CATALINA_PID=/opt/tomcat/temp/tomcat.pid"

          ExecStart=/opt/tomcat/bin/startup.sh
          ExecStop=/opt/tomcat/bin/shutdown.sh

          PIDFile=/opt/tomcat/temp/tomcat.pid

          Restart=on-failure
          RestartSec=5

          TimeoutStartSec=120
          TimeoutStopSec=60

          [Install]
          WantedBy=multi-user.target

          SERVICE


          # ==================================================
          # SYSTEMD
          # ==================================================

          echo "======================================"
          echo "RELOAD SYSTEMD"
          echo "======================================"

          sudo systemctl daemon-reload

          sudo systemctl enable tomcat


          # ==================================================
          # STOP OLD TOMCAT
          # ==================================================

          echo "======================================"
          echo "STOP OLD TOMCAT"
          echo "======================================"

          sudo systemctl stop tomcat || true


          # ==================================================
          # START TOMCAT
          # ==================================================

          echo "======================================"
          echo "START TOMCAT"
          echo "======================================"

          sudo systemctl start tomcat


          sleep 8


          # ==================================================
          # CHECK TOMCAT
          # ==================================================

          echo "======================================"
          echo "TOMCAT SERVICE STATUS"
          echo "======================================"

          sudo systemctl status tomcat \
            --no-pager


          if ! sudo systemctl is-active --quiet tomcat; then

              echo ""
              echo "======================================"
              echo "TOMCAT FAILED"
              echo "======================================"

              echo ""
              echo "===== SYSTEMD STATUS ====="

              sudo systemctl status tomcat \
                --no-pager || true


              echo ""
              echo "===== SYSTEMD JOURNAL ====="

              sudo journalctl \
                -u tomcat \
                -n 100 \
                --no-pager || true


              echo ""
              echo "===== CATALINA LOG ====="

              sudo tail -100 \
                /opt/tomcat/logs/catalina.out || true


              exit 1

          fi


          echo ""
          echo "Tomcat is running successfully."


          # ==================================================
          # PORT
          # ==================================================

          echo "======================================"
          echo "CHECK PORT 8080"
          echo "======================================"

          sudo ss -lntp | grep 8080 || true

          EOF


      # --------------------------------------------------------
      # Copy WAR
      # --------------------------------------------------------

      - name: Copy WAR to EC2
        run: |

          echo "======================================"
          echo "COPY WAR TO EC2"
          echo "======================================"

          scp -i ~/.ssh/ec2_key \
            target/neontask.war \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/neontask.war"


      # --------------------------------------------------------
      # Deploy WAR
      # --------------------------------------------------------

      - name: Deploy WAR to Tomcat
        run: |

          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -e


          echo "======================================"
          echo "STOP TOMCAT"
          echo "======================================"

          sudo systemctl stop tomcat || true


          # ==================================================
          # REMOVE OLD APPLICATION
          # ==================================================

          echo "======================================"
          echo "REMOVE OLD APPLICATION"
          echo "======================================"

          sudo rm -rf \
            /opt/tomcat/webapps/neontask

          sudo rm -f \
            /opt/tomcat/webapps/neontask.war


          # ==================================================
          # COPY NEW WAR
          # ==================================================

          echo "======================================"
          echo "COPY NEW WAR"
          echo "======================================"

          sudo cp \
            /tmp/neontask.war \
            /opt/tomcat/webapps/neontask.war


          # ==================================================
          # PERMISSIONS
          # ==================================================

          sudo chown \
            tomcat:tomcat \
            /opt/tomcat/webapps/neontask.war

          sudo chmod \
            644 \
            /opt/tomcat/webapps/neontask.war


          # ==================================================
          # START TOMCAT
          # ==================================================

          echo "======================================"
          echo "START TOMCAT"
          echo "======================================"

          sudo systemctl start tomcat


          # ==================================================
          # WAIT FOR DEPLOYMENT
          # ==================================================

          echo "======================================"
          echo "WAIT FOR WAR DEPLOYMENT"
          echo "======================================"

          DEPLOYED=false


          for i in {1..24}
          do

              if [ -d /opt/tomcat/webapps/neontask ]; then

                  echo "WAR deployed successfully."

                  DEPLOYED=true

                  break

              fi


              echo "Waiting for deployment... $i/24"

              sleep 5

          done


          # ==================================================
          # TOMCAT STATUS
          # ==================================================

          echo "======================================"
          echo "TOMCAT STATUS"
          echo "======================================"

          sudo systemctl status tomcat \
            --no-pager


          # ==================================================
          # WEBAPPS
          # ==================================================

          echo "======================================"
          echo "WEBAPPS DIRECTORY"
          echo "======================================"

          sudo ls -lah \
            /opt/tomcat/webapps/


          # ==================================================
          # APPLICATION DIRECTORY
          # ==================================================

          echo "======================================"
          echo "APPLICATION FILES"
          echo "======================================"

          if [ -d /opt/tomcat/webapps/neontask ]; then

              sudo find \
                /opt/tomcat/webapps/neontask \
                -maxdepth 2 \
                -type f | head -50

          else

              echo "Application directory was not created."

          fi


          # ==================================================
          # TEST TOMCAT
          # ==================================================

          echo "======================================"
          echo "TEST TOMCAT"
          echo "======================================"

          curl -I \
            http://localhost:8080 || true


          # ==================================================
          # TEST APPLICATION
          # ==================================================

          echo "======================================"
          echo "TEST APPLICATION"
          echo "======================================"

          curl -i \
            http://localhost:8080/neontask/ || true


          # ==================================================
          # CATALINA LOG
          # ==================================================

          echo "======================================"
          echo "CATALINA LOG"
          echo "======================================"

          sudo tail -150 \
            /opt/tomcat/logs/catalina.out || true


          # ==================================================
          # DEPLOYMENT CHECK
          # ==================================================

          if [ "$DEPLOYED" = false ]; then

              echo ""
              echo "======================================"
              echo "WAR DEPLOYMENT FAILED"
              echo "======================================"

              exit 1

          fi


          echo ""
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          EOF


      # --------------------------------------------------------
      # Final Message
      # --------------------------------------------------------

      - name: Deployment Complete
        run: |

          echo ""
          echo "=============================================="
          echo "        DEPLOYMENT COMPLETED"
          echo "=============================================="
          echo ""

          echo "Application URL:"

          echo "http://${{ secrets.EC2_HOST }}:8080/neontask/"

          echo ""

          echo "Tomcat Port: 8080"

          echo ""

          echo "Make sure EC2 Security Group allows:"
          echo "TCP 8080 from your IP."

          echo ""
          echo "=============================================="