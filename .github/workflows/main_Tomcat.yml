name: Build and Deploy Java WAR to Tomcat

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  deploy-tomcat:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout Code
      # =====================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # =====================================================
      # 2. Setup Java 17
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # =====================================================
      # 3. Build WAR
      # =====================================================

      - name: Build WAR
        run: |

          echo "=========================================="
          echo "Building Java WAR"
          echo "=========================================="

          mvn clean package -DskipTests

          echo "=========================================="
          echo "WAR FILE"
          echo "=========================================="

          ls -lh target/*.war


      # =====================================================
      # 4. Install / Configure Tomcat
      # =====================================================

      - name: Install and Configure Tomcat
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            set -e

            echo "=========================================="
            echo "JAVA"
            echo "=========================================="

            java -version


            # =================================================
            # Create Tomcat User
            # =================================================

            echo "=========================================="
            echo "TOMCAT USER"
            echo "=========================================="

            if id tomcat >/dev/null 2>&1; then

              echo "Tomcat user already exists."

            else

              sudo useradd \
                -r \
                -m \
                -U \
                -d /opt/tomcat \
                -s /bin/false \
                tomcat

            fi


            # =================================================
            # Check Existing Tomcat
            # =================================================

            echo "=========================================="
            echo "CHECKING TOMCAT"
            echo "=========================================="

            if sudo test -f /opt/tomcat/bin/startup.sh; then

              echo "Tomcat is already installed."

            else

              echo "Tomcat is not installed."
              echo "Installing Tomcat..."


              # -------------------------------------------------
              # Download
              # -------------------------------------------------

              cd /tmp

              sudo rm -f apache-tomcat-10.1.60.tar.gz

              sudo curl -fL \
                -o apache-tomcat-10.1.60.tar.gz \
                https://dlcdn.apache.org/tomcat/tomcat-10/v10.1.60/bin/apache-tomcat-10.1.60.tar.gz


              # -------------------------------------------------
              # Verify Download
              # -------------------------------------------------

              echo "Downloaded Tomcat:"

              sudo ls -lh \
                /tmp/apache-tomcat-10.1.60.tar.gz


              # -------------------------------------------------
              # Clean Old Directory
              # -------------------------------------------------

              sudo rm -rf /opt/tomcat

              sudo mkdir -p /opt/tomcat


              # -------------------------------------------------
              # Extract
              # -------------------------------------------------

              echo "Extracting Tomcat..."

              sudo tar \
                -xzf \
                /tmp/apache-tomcat-10.1.60.tar.gz \
                --strip-components=1 \
                -C /opt/tomcat


              # -------------------------------------------------
              # Verify
              # -------------------------------------------------

              echo "Checking startup.sh..."

              if sudo test -f /opt/tomcat/bin/startup.sh; then

                echo "Tomcat extraction successful."

              else

                echo "ERROR: startup.sh not found."

                sudo find /opt/tomcat \
                  -maxdepth 3 \
                  -type f \
                  | head -100

                exit 1

              fi

            fi


            # =================================================
            # Tomcat Permissions
            # =================================================

            echo "=========================================="
            echo "TOMCAT PERMISSIONS"
            echo "=========================================="

            sudo chown -R tomcat:tomcat /opt/tomcat

            sudo chmod +x /opt/tomcat/bin/*.sh


            # =================================================
            # Verify Tomcat Scripts
            # =================================================

            echo "=========================================="
            echo "TOMCAT SCRIPTS"
            echo "=========================================="

            sudo ls -lh /opt/tomcat/bin/startup.sh

            sudo ls -lh /opt/tomcat/bin/shutdown.sh

            sudo ls -lh /opt/tomcat/bin/catalina.sh


            # =================================================
            # Configure Tomcat Users
            # =================================================

            echo "=========================================="
            echo "TOMCAT USERS"
            echo "=========================================="

            sudo tee /opt/tomcat/conf/tomcat-users.xml > /dev/null <<'EOF'

            <?xml version="1.0" encoding="UTF-8"?>

            <tomcat-users
                xmlns="http://tomcat.apache.org/xml"
                xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                xsi:schemaLocation="http://tomcat.apache.org/xml tomcat-users.xsd"
                version="1.0">

                <role rolename="manager-gui"/>
                <role rolename="manager-script"/>
                <role rolename="manager-jmx"/>
                <role rolename="manager-status"/>

                <role rolename="admin-gui"/>
                <role rolename="admin-script"/>

                <user username="admin"
                      password="${{ secrets.TOMCAT_PASSWORD }}"
                      roles="manager-gui,manager-script,manager-jmx,manager-status,admin-gui,admin-script"/>

            </tomcat-users>

            EOF


            # =================================================
            # Configure Manager
            # =================================================

            echo "=========================================="
            echo "MANAGER CONFIGURATION"
            echo "=========================================="

            sudo tee /opt/tomcat/webapps/manager/META-INF/context.xml > /dev/null <<'EOF'

            <?xml version="1.0" encoding="UTF-8"?>

            <Context privileged="true">

                <CookieProcessor sameSiteCookies="strict" />

            </Context>

            EOF


            # =================================================
            # Configure Host Manager
            # =================================================

            sudo tee /opt/tomcat/webapps/host-manager/META-INF/context.xml > /dev/null <<'EOF'

            <?xml version="1.0" encoding="UTF-8"?>

            <Context privileged="true">

                <CookieProcessor sameSiteCookies="strict" />

            </Context>

            EOF


            # =================================================
            # Create Systemd Service
            # =================================================

            echo "=========================================="
            echo "SYSTEMD SERVICE"
            echo "=========================================="

            sudo tee /etc/systemd/system/tomcat.service > /dev/null <<'EOF'

            [Unit]
            Description=Apache Tomcat Web Application Container
            After=network.target

            [Service]

            Type=forking

            User=tomcat
            Group=tomcat

            Environment="JAVA_HOME=/usr/lib/jvm/java-17-amazon-corretto"
            Environment="CATALINA_HOME=/opt/tomcat"
            Environment="CATALINA_BASE=/opt/tomcat"
            Environment="CATALINA_PID=/opt/tomcat/temp/tomcat.pid"

            ExecStart=/opt/tomcat/bin/startup.sh
            ExecStop=/opt/tomcat/bin/shutdown.sh

            Restart=on-failure

            [Install]
            WantedBy=multi-user.target

            EOF


            # =================================================
            # Start Tomcat
            # =================================================

            echo "=========================================="
            echo "STARTING TOMCAT"
            echo "=========================================="

            sudo systemctl daemon-reload

            sudo systemctl enable tomcat

            sudo systemctl restart tomcat


            echo "Waiting for Tomcat..."

            sleep 10


            # =================================================
            # Tomcat Status
            # =================================================

            echo "=========================================="
            echo "TOMCAT STATUS"
            echo "=========================================="

            if sudo systemctl is-active --quiet tomcat; then

              echo "Tomcat is RUNNING."

            else

              echo "Tomcat FAILED to start."

              sudo systemctl status tomcat --no-pager || true

              echo "=========================================="
              echo "CATALINA LOG"
              echo "=========================================="

              sudo tail -100 \
                /opt/tomcat/logs/catalina.out || true

              exit 1

            fi


            # =================================================
            # Port 8080
            # =================================================

            echo "=========================================="
            echo "PORT 8080"
            echo "=========================================="

            sudo ss -lntp | grep 8080 || true


            # =================================================
            # Test Tomcat
            # =================================================

            echo "=========================================="
            echo "TESTING TOMCAT"
            echo "=========================================="

            curl -I \
              http://localhost:8080/ || true


      # =====================================================
      # 5. Copy WAR to EC2
      # =====================================================

      - name: Copy WAR to EC2
        uses: appleboy/scp-action@v0.1.7

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          source: "target/neontask.war"

          target: "/tmp/"


      # =====================================================
      # 6. Deploy WAR
      # =====================================================

      - name: Deploy WAR
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            set -e

            echo "=========================================="
            echo "DEPLOYING WAR"
            echo "=========================================="


            # =================================================
            # Check WAR
            # =================================================

            if [ ! -f /tmp/neontask.war ]; then

              echo "ERROR: WAR file not found."

              exit 1

            fi


            sudo ls -lh /tmp/neontask.war


            # =================================================
            # Remove Previous Deployment
            # =================================================

            echo "Removing old application..."

            sudo rm -rf \
              /opt/tomcat/webapps/neontask

            sudo rm -f \
              /opt/tomcat/webapps/neontask.war


            # =================================================
            # Copy New WAR
            # =================================================

            echo "Copying WAR..."

            sudo cp \
              /tmp/neontask.war \
              /opt/tomcat/webapps/neontask.war


            sudo chown \
              tomcat:tomcat \
              /opt/tomcat/webapps/neontask.war


            echo "WAR copied successfully."


            # =================================================
            # Restart Tomcat
            # =================================================

            echo "=========================================="
            echo "RESTARTING TOMCAT"
            echo "=========================================="

            sudo systemctl restart tomcat


            # =================================================
            # Wait for Deployment
            # =================================================

            echo "Waiting for WAR deployment..."

            sleep 15


            # =================================================
            # Tomcat Status
            # =================================================

            echo "=========================================="
            echo "TOMCAT STATUS"
            echo "=========================================="

            sudo systemctl status \
              tomcat \
              --no-pager


            # =================================================
            # Webapps
            # =================================================

            echo "=========================================="
            echo "WEBAPPS DIRECTORY"
            echo "=========================================="

            sudo ls -lah \
              /opt/tomcat/webapps/


            # =================================================
            # Check Extracted Application
            # =================================================

            echo "=========================================="
            echo "CHECKING APPLICATION"
            echo "=========================================="

            if [ -d /opt/tomcat/webapps/neontask ]; then

              echo "neontask directory exists."

            else

              echo "ERROR: neontask directory was not created."

              echo "=========================================="
              echo "CATALINA LOG"
              echo "=========================================="

              sudo tail -150 \
                /opt/tomcat/logs/catalina.out

              exit 1

            fi


            # =================================================
            # Application Contents
            # =================================================

            echo "=========================================="
            echo "APPLICATION CONTENTS"
            echo "=========================================="

            sudo find \
              /opt/tomcat/webapps/neontask \
              -maxdepth 2 \
              -type f \
              | head -100


            # =================================================
            # Test Application
            # =================================================

            echo "=========================================="
            echo "TESTING APPLICATION"
            echo "=========================================="

            HTTP_STATUS=$(curl \
              -s \
              -o /tmp/neontask-response.txt \
              -w "%{http_code}" \
              http://localhost:8080/neontask/)


            echo "HTTP STATUS: $HTTP_STATUS"


            # =================================================
            # Success
            # =================================================

            if [ "$HTTP_STATUS" = "200" ] || \
               [ "$HTTP_STATUS" = "301" ] || \
               [ "$HTTP_STATUS" = "302" ]; then

              echo "=========================================="
              echo "APPLICATION DEPLOYED SUCCESSFULLY"
              echo "=========================================="

            else

              echo "=========================================="
              echo "APPLICATION RETURNED HTTP $HTTP_STATUS"
              echo "=========================================="

              echo "Response:"

              cat /tmp/neontask-response.txt || true

              echo ""

              echo "=========================================="
              echo "CATALINA LOG"
              echo "=========================================="

              sudo tail -150 \
                /opt/tomcat/logs/catalina.out

              exit 1

            fi


            # =================================================
            # Final
            # =================================================

            echo "=========================================="
            echo "DEPLOYMENT COMPLETED"
            echo "=========================================="

            echo "Application URL:"

            echo "http://${{ secrets.EC2_HOST }}:8080/neontask/"