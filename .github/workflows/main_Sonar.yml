name: SonarQube Quality Check

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Connect to EC2
      # ==========================================

      - name: Install and Run SonarQube
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            echo "=========================================="
            echo "Starting SonarQube Setup"
            echo "=========================================="


            # ==========================================
            # 2. Update system
            # ==========================================

            echo "Updating system..."

            sudo dnf update -y


            # ==========================================
            # 3. Install Git
            # ==========================================

            echo "Installing Git..."

            sudo dnf install git -y


            # ==========================================
            # 4. Install Java 17
            # ==========================================

            echo "Installing Java 17..."

            sudo dnf install java-17-amazon-corretto-devel -y

            echo "Java version:"

            java -version


            # ==========================================
            # 5. Install Docker
            # ==========================================

            echo "Installing Docker..."

            sudo dnf install docker -y


            # ==========================================
            # 6. Start Docker
            # ==========================================

            echo "Starting Docker..."

            sudo systemctl enable docker

            sudo systemctl start docker


            echo "Docker status:"

            sudo systemctl status docker --no-pager


            # ==========================================
            # 7. Install Maven
            # ==========================================

            
            echo "Installing Maven..."

            sudo dnf install maven -y


            echo "Maven version:"

            mvn -version


            # ==========================================
            # 8. Clone Java Project
            # ==========================================

            echo "=========================================="
            echo "Cloning Java Project"
            echo "=========================================="


            cd /home/ec2-user


            sudo rm -rf JavaRepo-Project4-5


            sudo git clone \
              https://github.com/charan1911/JavaRepo-Project4-5.git


            sudo chown -R ec2-user:ec2-user \
              /home/ec2-user/JavaRepo-Project4-5


            cd /home/ec2-user/JavaRepo-Project4-5


            echo "Project files:"

            ls -lah


            # ==========================================
            # 9. Check Docker
            # ==========================================

            echo "Docker version:"

            sudo docker --version


            # ==========================================
            # 10. Check existing SonarQube container
            # ==========================================

            echo "Checking SonarQube container..."


            if sudo docker ps -a \
              --format '{{.Names}}' \
              | grep -q '^sonarqube$'
            then

              echo "SonarQube container already exists."

            else

              echo "Creating SonarQube container..."

              sudo docker pull sonarqube:community

              sudo docker run -d \
                --name sonarqube \
                --restart unless-stopped \
                -p 9000:9000 \
                sonarqube:community

            fi


            # ==========================================
            # 11. Start SonarQube
            # ==========================================

            echo "Starting SonarQube..."

            sudo docker start sonarqube 2>/dev/null || true


            # ==========================================
            # 12. Check container
            # ==========================================

            echo "SonarQube container status:"

            sudo docker ps -a \
              --filter name=sonarqube


            # ==========================================
            # 13. Wait for SonarQube
            # ==========================================

            echo "=========================================="
            echo "Waiting for SonarQube"
            echo "=========================================="


            for i in {1..30}
            do

              STATUS=$(curl -s \
                http://localhost:9000/api/system/status \
                | grep -o '"status":"[^"]*"' \
                | head -1)


              echo "Attempt $i"
              echo "SonarQube status: $STATUS"


              if echo "$STATUS" | grep -q '"status":"UP"'
              then

                echo "SonarQube is UP."

                break

              fi


              if [ "$i" -eq 30 ]
              then

                echo "SonarQube failed to start."

                sudo docker logs \
                  --tail 100 \
                  sonarqube

                exit 1

              fi


              sleep 10

            done


            # ==========================================
            # 14. Build Java Project
            # ==========================================

            echo "=========================================="
            echo "Building Java Project"
            echo "=========================================="


            cd /home/ec2-user/JavaRepo-Project4-5


            mvn clean verify -DskipTests


            # ==========================================
            # 15. Download Sonar Scanner
            # ==========================================

            echo "=========================================="
            echo "Installing Sonar Scanner"
            echo "=========================================="


            cd /tmp


            rm -rf sonar-scanner*


            wget -q \
              https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.2.0.4588-linux-x64.zip


            unzip -q \
              sonar-scanner-cli-7.2.0.4588-linux-x64.zip


            sudo rm -rf /opt/sonar-scanner


            sudo mv \
              sonar-scanner-7.2.0.4588-linux-x64 \
              /opt/sonar-scanner


            sudo chmod +x \
              /opt/sonar-scanner/bin/sonar-scanner


            # ==========================================
            # 16. Configure Sonar Scanner
            # ==========================================

            sudo tee \
              /opt/sonar-scanner/conf/sonar-scanner.properties \
              > /dev/null <<EOF

            sonar.host.url=http://localhost:9000

            EOF


            export PATH=$PATH:/opt/sonar-scanner/bin


            echo "Sonar Scanner version:"

            sonar-scanner --version


            # ==========================================
            # 17. Run SonarQube Analysis
            # ==========================================

            echo "=========================================="
            echo "Running SonarQube Analysis"
            echo "=========================================="


            cd /home/ec2-user/JavaRepo-Project4-5


            sonar-scanner \
              -Dsonar.projectKey=JavaRepo-Project4-5 \
              -Dsonar.projectName=JavaRepo-Project4-5 \
              -Dsonar.sources=src \
              -Dsonar.java.binaries=target/classes \
              -Dsonar.host.url=http://localhost:9000 \
              -Dsonar.token=${{ secrets.SONAR_TOKEN }}


            # ==========================================
            # 18. Final SonarQube status
            # ==========================================

            echo "=========================================="
            echo "SonarQube Analysis Completed"
            echo "=========================================="


            curl -s \
              http://localhost:9000/api/system/status


            echo ""


            echo "=========================================="
            echo "SonarQube URL"
            echo "=========================================="


            echo "http://${{ secrets.EC2_HOST }}:9000"


            echo "=========================================="
            echo "Workflow Completed Successfully"
            echo "=========================================="