name: SonarQube Quality Check

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  sonarqube:

    runs-on: ubuntu-latest

    steps:

      - name: Run SonarQube Analysis
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            set -e

            echo "=========================================="
            echo "SonarQube Quality Check"
            echo "=========================================="


            # ------------------------------------------
            # Check Java
            # ------------------------------------------

            echo "Java version:"
            java -version


            # ------------------------------------------
            # Check Maven
            # ------------------------------------------

            echo "Maven version:"
            mvn -version


            # ------------------------------------------
            # Check Docker
            # ------------------------------------------

            echo "Docker version:"
            sudo docker --version


            # ------------------------------------------
            # Start SonarQube
            # ------------------------------------------

            echo "Checking SonarQube..."

            if ! sudo docker ps \
              --format '{{.Names}}' \
              | grep -q '^sonarqube$'
            then

              echo "Starting SonarQube..."

              sudo docker start sonarqube

            else

              echo "SonarQube is already running."

            fi


            # ------------------------------------------
            # Wait for SonarQube
            # ------------------------------------------

            echo "Waiting for SonarQube..."

            for i in {1..30}
            do

              STATUS=$(curl -s \
                http://localhost:9000/api/system/status \
                | grep -o '"status":"[^"]*"' \
                | head -1)

              echo "Attempt $i: $STATUS"

              if echo "$STATUS" | grep -q '"status":"UP"'
              then

                echo "SonarQube is UP."

                break

              fi


              if [ "$i" -eq 30 ]
              then

                echo "SonarQube did not become ready."

                sudo docker logs \
                  --tail 100 \
                  sonarqube

                exit 1

              fi

              sleep 10

            done


            # ------------------------------------------
            # Clone Project
            # ------------------------------------------

            cd /home/ec2-user

            sudo rm -rf JavaRepo-Project4-5

            sudo git clone \
              https://github.com/charan1911/JavaRepo-Project4-5.git

            sudo chown -R ec2-user:ec2-user \
              /home/ec2-user/JavaRepo-Project4-5


            # ------------------------------------------
            # Go to Project
            # ------------------------------------------

            cd /home/ec2-user/JavaRepo-Project4-5


            # ------------------------------------------
            # Build Project
            # ------------------------------------------

            echo "=========================================="
            echo "Building Java Project"
            echo "=========================================="

            mvn clean verify -DskipTests


            # ------------------------------------------
            # SonarQube Analysis
            # ------------------------------------------

            echo "=========================================="
            echo "Running SonarQube Analysis"
            echo "=========================================="

            mvn sonar:sonar \
              -Dsonar.projectKey=JavaRepo-Project4-5 \
              -Dsonar.projectName=JavaRepo-Project4-5 \
              -Dsonar.host.url=http://localhost:9000 \
              -Dsonar.token=${{ secrets.SONAR_TOKEN }}


            # ------------------------------------------
            # Completed
            # ------------------------------------------

            echo "=========================================="
            echo "SonarQube Analysis Completed"
            echo "=========================================="

            echo "SonarQube URL:"
            echo "http://${{ secrets.EC2_HOST }}:9000"